name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gym-tracker

jobs:
  # ─────────────────────────────────────────────────────────
  # Build & push Docker images
  # Uses docker/metadata-action to compute correct tag list
  # Then a single build-push-action with all tags
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags for backend
      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          bake-target: gym-backend

      # Compute tags for frontend
      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          bake-target: gym-frontend

      # Build & push backend
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & push frontend
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # Backend unit tests (in container, from local Dockerfile)
  # ─────────────────────────────────────────────────────────
  unit-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image (use dev target — has vitest)
        run: docker build -t gym-backend:test --target dev ./backend
      - name: Run tests
        run: docker run --rm gym-backend:test npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────
  # Frontend unit tests
  # ─────────────────────────────────────────────────────────
  unit-frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image (use build target — has vitest)
        run: docker build -t gym-frontend:test --target build ./frontend
      - name: Run tests
        run: docker run --rm gym-frontend:test npm test -- --run

  # ─────────────────────────────────────────────────────────
  # E2E: backend + frontend containers + Playwright container
  # ─────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all test images
        run: |
          docker build -t gym-backend:test --target prod ./backend
          docker build -t gym-frontend:test --target prod ./frontend
          docker build -t gym-e2e:test ./e2e

      - name: Create test network
        run: docker network create gym-test-net || true

      - name: Start backend container
        run: |
          docker run -d --name test-backend \
            --network gym-test-net \
            -e NODE_ENV=test \
            -e PORT=3001 \
            gym-backend:test
          for i in {1..30}; do
            if docker exec test-backend wget -q --spider http://localhost:3001/api/health 2>/dev/null; then
              echo "Backend ready"; break
            fi
            sleep 2
          done

      - name: Start frontend container
        run: |
          docker run -d --name test-frontend \
            --network gym-test-net \
            -p 8080:80 \
            gym-frontend:test
          for i in {1..30}; do
            if curl -s http://localhost:8080/ > /dev/null 2>&1; then
              echo "Frontend ready"; break
            fi
            sleep 2
          done

      - name: Run E2E container
        run: |
          # Get container IPs as fallback (Playwright image sometimes has DNS issues)
          FRONTEND_IP=$(docker inspect test-frontend --format '{{ index .NetworkSettings.Networks "gym-test-net" "IPAddress" }}')
          BACKEND_IP=$(docker inspect test-backend --format '{{ index .NetworkSettings.Networks "gym-test-net" "IPAddress" }}')
          echo "test-frontend IP: $FRONTEND_IP"
          echo "test-backend IP: $BACKEND_IP"

          docker run --rm --name test-e2e \
            --network gym-test-net \
            --ipc=host \
            --add-host="test-frontend:${FRONTEND_IP}" \
            --add-host="test-backend:${BACKEND_IP}" \
            -e BASE_URL=http://test-frontend \
            -e API_URL=http://test-backend:3001 \
            -v "${{ github.workspace }}/e2e/screenshots:/app/screenshots" \
            gym-e2e:test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-backend test-frontend test-e2e 2>/dev/null || true
          docker network rm gym-test-net 2>/dev/null || true
