name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gym-tracker
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Build & push unified Docker image (frontend + backend)
  # Multi-arch: linux/amd64 + linux/arm64 (M1/M2 Mac, ARM servers)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build & push unified image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # Backend unit tests (in container)
  # ─────────────────────────────────────────────────────────
  unit-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image (use dev target — has vitest)
        run: docker build -t gym-backend:test --target dev ./backend
      - name: Run tests
        run: docker run --rm gym-backend:test npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────
  # Frontend unit tests
  # ─────────────────────────────────────────────────────────
  unit-frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image (use build target — has vitest)
        run: docker build -t gym-frontend:test --target build ./frontend
      - name: Run tests
        run: docker run --rm gym-frontend:test npm test -- --run

  # ─────────────────────────────────────────────────────────
  # E2E: single app container + Playwright container
  # ─────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t gym-tracker:test --target prod .
          docker build -t gym-e2e:test ./e2e

      - name: Run e2e stack
        run: |
          docker compose -f docker-compose.ci.yml up --abort-on-container-exit --exit-code-from e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v 2>/dev/null || true
