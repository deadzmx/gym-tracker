name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gym-tracker
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Build all Docker images + push to GHCR (on main/tags only)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          # Tags for backend/frontend (skip E2E — only used locally)
          TAGS="${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}"
          TAGS="$TAGS\n${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS\n${{ env.IMAGE_PREFIX }}-backend:latest"
            TAGS="$TAGS\n${{ env.IMAGE_PREFIX }}-frontend:latest"
          fi
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS\n${{ env.IMAGE_PREFIX }}-backend:$VERSION"
            TAGS="$TAGS\n${{ env.IMAGE_PREFIX }}-frontend:$VERSION"
          fi
          echo "TAGS<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Tag backend for GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          # Push tagged versions
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            docker push ${{ env.IMAGE_PREFIX }}-backend:latest
          fi
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            docker tag ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }} \
              ${{ env.IMAGE_PREFIX }}-backend:$VERSION
            docker push ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            docker push ${{ env.IMAGE_PREFIX }}-backend:$VERSION
          fi

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Tag frontend for GHCR
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }} \
              ${{ env.IMAGE_PREFIX }}-frontend:latest
            docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            docker push ${{ env.IMAGE_PREFIX }}-frontend:latest
          fi
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            docker tag ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }} \
              ${{ env.IMAGE_PREFIX }}-frontend:$VERSION
            docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            docker push ${{ env.IMAGE_PREFIX }}-frontend:$VERSION
          fi

      - name: Build E2E image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./e2e
          file: ./e2e/Dockerfile
          push: false
          tags: gym-e2e:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

  # ─────────────────────────────────────────────────────────
  # Backend unit tests (in container)
  # ─────────────────────────────────────────────────────────
  unit-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t gym-backend:test --target prod ./backend
      - name: Run tests
        run: docker run --rm gym-backend:test npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────
  # Frontend unit tests (in container)
  # ─────────────────────────────────────────────────────────
  unit-frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t gym-frontend:test --target build ./frontend
      - name: Run tests
        run: docker run --rm gym-frontend:test npm test -- --run

  # ─────────────────────────────────────────────────────────
  # E2E: spin up stack + run Playwright container
  # ─────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-backend, unit-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create test network
        run: docker network create gym-test-net || true

      - name: Start backend container
        run: |
          docker run -d --name test-backend \
            --network gym-test-net \
            -e NODE_ENV=test \
            -e PORT=3001 \
            gym-backend:test
          for i in {1..30}; do
            if docker exec test-backend wget -q --spider http://localhost:3001/api/health 2>/dev/null; then
              echo "Backend ready"; break
            fi
            sleep 2
          done

      - name: Start frontend container
        run: |
          docker run -d --name test-frontend \
            --network gym-test-net \
            -p 8080:80 \
            gym-frontend:test
          for i in {1..30}; do
            if curl -s http://localhost:8080/ > /dev/null 2>&1; then
              echo "Frontend ready"; break
            fi
            sleep 2
          done

      - name: Run E2E container
        run: |
          docker run --rm --name test-e2e \
            --network gym-test-net \
            -e BASE_URL=http://test-frontend \
            -v "${{ github.workspace }}/e2e/screenshots:/app/screenshots" \
            gym-e2e:test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f test-backend test-frontend test-e2e 2>/dev/null || true
          docker network rm gym-test-net 2>/dev/null || true
