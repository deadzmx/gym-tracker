# ────────────────────────────────────────────────────────────
# CI-only test stack — used by GitHub Actions
# Spins up the unified app, runs e2e against it
# Then tears down.
# ────────────────────────────────────────────────────────────

name: gym-tracker-ci

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: gym-tracker:test
    container_name: ci-app
    environment:
      NODE_ENV: test
      PORT: 3001
      DB_PATH: /app/backend/data/gym.db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/api/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  e2e:
    image: gym-e2e:test
    container_name: ci-e2e
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app
      API_URL: http://app:3001
    volumes:
      - ./e2e/screenshots:/app/screenshots
      - ./e2e/test-results:/app/test-results
