# ────────────────────────────────────────────────────────────
# CI-only test stack — used by GitHub Actions
# Spins up the unified app, runs e2e against it
# Then tears down.
# ────────────────────────────────────────────────────────────

name: gym-tracker-ci

services:
  tracker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: gym-tracker:test
    container_name: ci-tracker
    environment:
      NODE_ENV: test
      PORT: 3001
      DB_PATH: /app/backend/data/gym.db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\" || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  e2e:
    image: gym-e2e:test
    container_name: ci-e2e
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      BASE_URL: http://tracker:3001
      API_URL: http://tracker:3001
    volumes:
      - ./e2e/screenshots:/app/screenshots
      - ./e2e/test-results:/app/test-results
