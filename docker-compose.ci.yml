# ────────────────────────────────────────────────────────────
# CI-only test stack — used by GitHub Actions
# Spins up backend + frontend, runs e2e against them
# Then tears down.
# ────────────────────────────────────────────────────────────

name: gym-tracker-ci

services:
  backend:
    image: gym-backend:test
    container_name: ci-backend
    environment:
      NODE_ENV: test
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  frontend:
    image: gym-frontend:test
    container_name: ci-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  e2e:
    image: gym-e2e:test
    container_name: ci-e2e
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      BASE_URL: http://frontend
      API_URL: http://backend:3001
    volumes:
      - ./e2e/screenshots:/app/screenshots
      - ./e2e/test-results:/app/test-results
