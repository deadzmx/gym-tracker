# ────────────────────────────────────────────────────────────
# Development compose — STANDALONE (not an override)
# Usage:  make dev  /  docker compose -f docker-compose.dev.yml up --build
#
# Splits into 2 containers (backend + frontend) for hot reload.
# Production uses the unified single-container docker-compose.yml.
# ────────────────────────────────────────────────────────────

name: gym-tracker-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: gym-backend:dev
    container_name: gym-backend-dev
    restart: unless-stopped
    command: npx tsx watch src/server.ts
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - gym-data:/app/data
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: gym-frontend:dev
    container_name: gym-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    depends_on:
      - backend

volumes:
  gym-data:
    name: gym-data
