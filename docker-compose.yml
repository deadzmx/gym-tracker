# ────────────────────────────────────────────────────────────
# Production docker-compose for gym-tracker (unified)
# Single container: Express serves API + frontend static files
# Run:  make up  /  docker compose up -d --build
# ────────────────────────────────────────────────────────────

name: gym-tracker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/deadzmx/gym-tracker:latest
    container_name: gym-tracker
    restart: unless-stopped
    ports:
      - "8123:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Backend's DB path defaults to <cwd>/data/gym.db.
      # Container cwd is /app, but backend is at /app/backend.
      # Set explicitly so the volume mount works.
      DB_PATH: /app/backend/data/gym.db
    volumes:
      - gym-data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  gym-data:
    name: gym-data
